name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ChatGPT-Estudante.apk

      - name: Publicar na release fixa "app"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release delete app --cleanup-tag --yes || true
          gh release create app ChatGPT-Estudante.apk \
            --target "${{ github.sha }}" \
            --title "ChatGPT Estudante (versão $VERSION)" \
            --notes "APK mais recente, compilado automaticamente a partir do commit ${{ github.sha }} na branch ${{ github.ref_name }}.

          Link fixo para baixar sempre a última versão:
          https://github.com/${{ github.repository }}/releases/download/app/ChatGPT-Estudante.apk" \
            --latest
